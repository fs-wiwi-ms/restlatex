services:
  restlatex:
    build:
      context: .
      dockerfile: Dockerfile
    image: restlatex:latest
    container_name: restlatex-service
    ports:
      - "8000:8000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    environment:
      - RESTLATEX_TIMEOUT_SECONDS=30
      - RESTLATEX_MAX_MEMORY_MB=512
      - RESTLATEX_MAX_FILE_SIZE_MB=50
