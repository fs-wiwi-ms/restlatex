services:
  restlatex:
    build:
      context: .
      dockerfile: Dockerfile
    image: restlatex:latest
    container_name: restlatex-service
    ports:
      - "127.0.0.1:8000:8000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    mem_limit: 2048m
    cpus: 2.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - RESTLATEX_TIMEOUT_SECONDS=30
      - RESTLATEX_MAX_MEMORY_MB=512
      - RESTLATEX_MAX_FILE_SIZE_MB=50
